name: Synthetic dispatch query benchmark
on:
  pull_request:
    paths:
      - 'tests/integration/dispatch-query-benchmark.test.ts'
      - '.github/workflows/dispatch-benchmark.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  benchmark:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: contentos_benchmark_test
          POSTGRES_USER: contentos
          POSTGRES_PASSWORD: ci-test-only
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U contentos -d contentos_benchmark_test"
          --health-interval 5s --health-timeout 3s --health-retries 15
    env:
      TEST_DATABASE_URL: postgresql://contentos:ci-test-only@localhost:5432/contentos_benchmark_test
      CONTENTOS_DISPATCH_BENCHMARK: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.30.3
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec vitest run tests/integration/dispatch-query-benchmark.test.ts
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: synthetic-dispatch-query-plans
          path: test-results/dispatch-benchmark/
          retention-days: 3
